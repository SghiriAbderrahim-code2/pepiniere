<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1600 900"
  width="1600"
  height="900"
  role="img"
  aria-label="مجموعة من النباتات الخضراء"
>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F5EA" />
      <stop offset="1" stop-color="#EFEBDB" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="28%" r="60%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <g id="leaf">
      <path d="M0 0 C 20 -34 20 -96 0 -140 C -20 -96 -20 -34 0 0 Z" />
      <path
        d="M0 -10 L0 -126"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity="0.35"
        stroke-width="3"
        stroke-linecap="round"
      />
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />
  <rect width="1600" height="900" fill="url(#glow)" />

  <circle cx="260" cy="230" r="200" fill="#81C784" opacity="0.16" />
  <circle cx="1340" cy="200" r="260" fill="#2E7D32" opacity="0.10" />
  <circle cx="1230" cy="720" r="170" fill="#173F2A" opacity="0.08" />
  <circle cx="240" cy="720" r="140" fill="#81C784" opacity="0.14" />

  <ellipse cx="800" cy="850" rx="430" ry="42" fill="#173F2A" opacity="0.06" />

  <use href="#leaf" transform="translate(800,835) rotate(-60) scale(0.9)" fill="#81C784" opacity="0.85" />
  <use href="#leaf" transform="translate(800,835) rotate(60) scale(0.9)" fill="#81C784" opacity="0.85" />
  <use href="#leaf" transform="translate(800,835) rotate(-40) scale(1.3)" fill="#2E7D32" />
  <use href="#leaf" transform="translate(800,835) rotate(40) scale(1.3)" fill="#2E7D32" />
  <use href="#leaf" transform="translate(800,835) rotate(-20) scale(1.6)" fill="#81C784" />
  <use href="#leaf" transform="translate(800,835) rotate(20) scale(1.6)" fill="#81C784" />
  <use href="#leaf" transform="translate(800,835) rotate(0) scale(2.0)" fill="#173F2A" />
</svg>
